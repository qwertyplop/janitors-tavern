kind = "web"
previewPath = "/"
title = "Janitor's Tavern"
version = "1.0.0"
id = "artifacts/janitors-tavern"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20418

[services.development]
run = "pnpm --filter @workspace/janitors-tavern run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/janitors-tavern", "run", "build" ]
publicDir = "artifacts/janitors-tavern/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20418"
BASE_PATH = "/"
